services:
  - type: web
    name: zudo-smm-panel
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: zudo-postgres
          property: connectionString
      - key: DATABASE_SSL
        value: auto
      - key: SESSION_SECRET
        generateValue: true
      - key: OWNER_USERNAME
        value: zudo
      - key: OWNER_PASSWORD
        sync: false
      - key: SMM_API_URL
        value: https://mysmm.org/api/v2
      - key: SMM_API_KEY
        sync: false
      - key: UPI_ID
        value: Fearlessaditya@fam
      - key: PROVIDER_CURRENCY
        value: INR
databases:
  - name: zudo-postgres
    databaseName: zudo
    user: zudo
    plan: 0.1c-256mb
    postgresMajorVersion: "16"
